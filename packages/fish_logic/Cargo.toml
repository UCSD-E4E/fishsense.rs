[package]
name = "fish_logic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
app_dirs2 = "2.5.5"
arrow = "55.2.0"
bytes = "1.10.1"
cv-convert = { git = "https://github.com/ccrutchf/rust-cv-convert.git", rev = "1ac6ea2b50f0b78da3f35207a54eaa9e8a9c1226", version = "0.25.0", features = ["opencv_0-91", "ndarray_0-15"] }
faer = "0.22.6"
futures = "0.3.31"
geo = "0.30.0"
image.workspace = true
imageproc = "0.25.0"
lance-arrow = "0.31.0"
lancedb = "0.21.0"
nalgebra = { version = "0.33.2", features = ["alloc"] }
ndarray.workspace = true
ndarray-npy = "0.8.1"
ndarray-stats = { git = "https://github.com/ccrutchf/ndarray-stats.git", version = "0.5.1" }
npyz = "0.8.4"
num = "0.4.3"
opencv = { version = "0.95.0", features = ["clang-runtime"] }
ort = { git = "https://github.com/pykeio/ort.git", tag = "v2.0.0-rc.2", version = "2.0.0-rc.2" }
rayon = "1.10.0"
reqwest = { version = "0.12.22", features = ["blocking"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["full"] }

